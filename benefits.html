<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Benefits Finder</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

<h1>🇺🇸 Veteran Benefits Navigator</h1>

<p>Benefits Finder</p>

<nav>

<a href="index.html">Home</a>

<a href="benefits.html">Benefits</a>

</nav>

</header>

<main>

<section class="card">

<h2>Benefits Finder</h2>

<p>
Select your VA disability rating and state to view benefits.
</p>

<label>Disability Rating</label>

<select id="rating">

<option value="">Select Rating</option>

<option>0%</option>
<option>10%</option>
<option>20%</option>
<option>30%</option>
<option>40%</option>
<option>50%</option>
<option>60%</option>
<option>70%</option>
<option>80%</option>
<option>90%</option>
<option>100%</option>
<option>TDIU</option>
<option>Permanent & Total</option>

</select>

<label>State</label>

<select id="state">

<option value="">Select State</option>

<option>South Carolina</option>
<option>Florida</option>
<option>Georgia</option>
<option>North Carolina</option>
<option>Virginia</option>
<option>Texas</option>
<option>California</option>

</select>

<br><br>

<button onclick="showBenefits()">

Show My Benefits

</button>

</section>

<div id="results" style="display:none;">

<section class="card">

<h2 id="title"></h2>

<h3>🏥 VA Benefits</h3>

<ul id="vaBenefits"></ul>

</section>

<section class="card">

<h3>🇺🇸 Federal Benefits</h3>

<ul id="federalBenefits"></ul>

</section>

<section class="card">

<h3>🏛 State Benefits</h3>

<ul id="stateBenefits"></ul>

</section>

</div>

</main>

<script src="js/app.js"></script>

</body>

</html>
